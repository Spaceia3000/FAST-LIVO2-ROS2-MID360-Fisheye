# Cohemo LIVO: MID-360 LiDAR + internal IMU and Sony FCB-EV9520L.
# Intrinsics loaded from config/camera_sony_ev9520l.yaml (separate params file).
# Koide input: supplied calib.json SHA256 2c6916bbcc91194534da2a9ab98781fac375514a6808df9c8993f8c31bfe181d
# Koide T_lidar_camera = lidar <- camera, quaternion order [qx,qy,qz,qw].
# FAST-LIVO2 extrin_calib.Rcl/Pcl below = camera <- lidar (inverse Koide).
# PROVISIONAL until independent LiDAR-camera reprojection/timing validation.
/**:
  ros__parameters:
    common:
      img_en: 1
      img_topic: /cam0/image_raw
      imu_topic: /mid360/livox/imu
      lid_topic: /mid360/livox/lidar
      lidar_en: 1
      ros_driver_bug_fix: false
    diagnostics:
      ingest:
        enabled: true
    evo:
      pose_output_en: false
      seq_name: cohemo_livo
    extrin_calib:
      Pcl:
      - 0.014193501263421
      - -0.118385521517688
      - -0.033443592705196
      Rcl:
      - -0.036512120518242
      - -0.999300700753691
      - 0.008060677914660
      - -0.034221085854262
      - -0.006811048140883
      - -0.999391078060125
      - 0.998747106297794
      - -0.036765732637948
      - -0.033948469264141
      extrinsic_R:
      - 0.999910200
      - -0.010329711
      - 0.008537470
      - 0.010513572
      - 0.999707527
      - -0.021779027
      - -0.008310002
      - 0.021866831
      - 0.999726355
      extrinsic_T:
      - -0.007329500
      - -0.022027500
      - 0.046131000
    image_save:
      img_save_en: false
      interval: 1
    imu:
      acc_cov: 0.5
      b_acc_cov: 0.0001
      b_gyr_cov: 0.0001
      gyr_cov: 0.3
      imu_en: true
      imu_int_frame: 30
    lio:
      beam_err: 0.05
      dept_err: 0.02
      layer_init_num:
      - 5
      - 5
      - 5
      - 5
      - 5
      max_iterations: 5
      max_layer: 2
      max_points_num: 50
      min_eigen_value: 0.0025
      voxel_size: 0.5
    local_map:
      half_map_size: 100
      map_sliding_en: false
      sliding_thresh: 8.0
    localizability:
      calibration:
        enabled: false
        histogram_bins: 0
    pcd_save:
      colmap_output_en: false
      filter_size_pcd: 0.15
      interval: -1
      pcd_save_en: false
      type: 0
    preprocess:
      blind: 0.8
      filter_size_surf: 0.1
      lidar_type: 1
      point_filter_num: 2
      scan_line: 6
    publish:
      blind_rgb_points: 0.0
      dense_map_en: true
      lidar_information_en: true
      lidar_information_topic: /lidar_measurement_information
      lidar_localizability_calibration_en: false
      lidar_localizability_calibration_qos_depth: 0
      lidar_localizability_calibration_topic: /lidar_localizability_calibration
      metric_cloud_en: true
      metric_cloud_topic: /cloud_registered_metric
      pub_effect_point_en: false
      pub_plane_en: false
      pub_scan_num: 1
    runtime:
      image_admission_hz: 5.0
      ingest_spin_budget_ms: 5
    time_offset:
      exposure_time_init: 0.0
      img_time_offset: 0.0
      imu_time_offset: -0.017737000
    uav:
      gravity_align_en: false
      imu_rate_odom: false
    vio:
      exposure_estimate_en: true
      img_point_cov: 100
      inv_expo_cov: 0.1
      inverse_composition_en: false
      max_iterations: 5
      max_visual_points_per_voxel: 32
      normal_en: true
      outlier_threshold: 1000
      patch_pyrimid_level: 4
      patch_size: 8
      raycast_en: false
