/**:
  ros__parameters:
    common:
      img_topic: "/camera/camera/color/image_raw"
      lid_topic: "/mid360/livox/lidar"
      imu_topic: "/mid360/livox/imu"
      img_en: 1
      lidar_en: 1
      ros_driver_bug_fix: false

    extrin_calib:
      extrinsic_T: [-0.007329500, -0.022027500, 0.046131000]
      extrinsic_R: [ 0.999910200,-0.010329711, 0.008537470,
                     0.010513572, 0.999707527,-0.021779027,
                    -0.008310002, 0.021866831, 0.999726355]
      Rcl: [ -0.012648705165646978,   -0.9998963733180353, 0.006874073251966595,
             -0.025684498783597853, -0.006547460933093774,   -0.999648656917802,
                0.9995900743704234, -0.012820818256666477,  -0.0255990202812848] 
      Pcl: [0.051160572422022266, -0.10015307608455289,-0.025736155048636886]

    time_offset: 
      imu_time_offset: 0.0
      img_time_offset: 0.1
      exposure_time_init: 0.0

    preprocess:
      point_filter_num: 2
      filter_size_surf: 0.15
      lidar_type: 1 # Livox Avia LiDAR
      scan_line: 6
      blind: 0.8

    vio:
      max_iterations: 5
      outlier_threshold: 1000 # 78 100 156 #100 200 500 700 infinite
      img_point_cov: 100 # 100 1000 
      patch_size: 8
      patch_pyrimid_level: 4
      normal_en: true
      raycast_en: false
      inverse_composition_en: false
      exposure_estimate_en: true
      inv_expo_cov: 0.1

    imu:
      imu_en: true
      imu_int_frame: 30
      acc_cov: 0.5 # 0.2
      gyr_cov: 0.3 # 0.5
      b_acc_cov: 0.0001 # 0.1
      b_gyr_cov: 0.0001 # 0.1

    lio:
      max_iterations: 5
      dept_err: 0.02
      beam_err: 0.05
      min_eigen_value: 0.0025 # 0.005
      voxel_size: 0.5
      max_layer: 2
      max_points_num: 50
      layer_init_num: [5, 5, 5, 5, 5]

    local_map:  
      map_sliding_en: false
      half_map_size: 100
      sliding_thresh: 8.0

    uav:
      imu_rate_odom: false
      gravity_align_en: false

    publish:
      dense_map_en: true
      pub_effect_point_en: false 
      pub_plane_en: false
      pub_scan_num: 1
      blind_rgb_points: 0.0

    evo:
      seq_name: "CBD_Building_01"
      pose_output_en: false

    pcd_save:
      pcd_save_en: false
      type: 0 # 0: World Frame, 1: Body Frame;
      colmap_output_en: false # need to set interval = -1
      filter_size_pcd: 0.15
      interval: -1
      # how many LiDAR frames saved in each pcd file;
      # -1 : all frames will be saved in ONE pcd file, may lead to memory crash when having too much frames.

    image_save:
      img_save_en: false
      interval: 1
